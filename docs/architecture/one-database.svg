<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" width="1200" height="730" font-family="'Special Gothic', 'Helvetica Neue', Arial, sans-serif">
  <title>Typical RAG stack versus RAG on one MongoDB Atlas cluster</title>
  <desc>Left: six separate systems with two sync pipelines. Right: one Atlas cluster runs embedding, lexical and vector search, fusion and rerank in one aggregation, next to the operational data. Only generation leaves the database.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9ea2a1"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#FF6960"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#00ED64"/>
    </marker>
    <style>
      .t  { fill: #fdfff5; font-size: 15px; font-weight: 700; }
      .s  { fill: #cdd5ce; font-size: 12px; }
      .m  { fill: #9ea2a1; font-size: 12px; }
      .mono { font-family: 'Source Code Pro', Menlo, Consolas, monospace; }
      .h  { fill: #fdfff5; font-size: 22px; font-weight: 700; letter-spacing: 0.5px; }
      .box { fill: #0a2633; stroke: #2a424d; stroke-width: 1.2; }
      .box-red { fill: #0a2633; stroke: #FF6960; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .stage { fill: #0a2633; stroke: rgba(0,237,100,0.45); stroke-width: 1.2; }
      .pill { fill: rgba(255,173,0,0.14); stroke: #ffad00; stroke-width: 1; }
      .pill-t { fill: #ffad00; font-size: 9.5px; font-weight: 700; letter-spacing: 0.8px; }
    </style>
  </defs>

  <rect width="1200" height="730" fill="#061621"/>

  <!-- ============ LEFT: typical stack ============ -->
  <rect x="24" y="24" width="552" height="572" rx="14" fill="#001e2b" stroke="#2a424d"/>
  <text x="48" y="62" class="h">TYPICAL RAG STACK</text>
  <text x="48" y="84" class="m">six systems to run, two copies of the data to keep in sync</text>

  <rect x="190" y="104" width="200" height="56" rx="8" class="box"/>
  <text x="290" y="128" class="t" text-anchor="middle">Application</text>
  <text x="290" y="146" class="s" text-anchor="middle">fusion code, retries, glue</text>

  <!-- left column -->
  <rect x="48" y="200" width="200" height="56" rx="8" class="box"/>
  <text x="148" y="224" class="t" text-anchor="middle">OLTP database</text>
  <text x="148" y="242" class="s" text-anchor="middle">conversations, users, ACL</text>

  <rect x="48" y="300" width="200" height="56" rx="8" class="box-red"/>
  <text x="148" y="324" class="t" text-anchor="middle">ETL / CDC</text>
  <text x="148" y="342" class="s" text-anchor="middle">keeps the copies in step</text>

  <rect x="48" y="400" width="200" height="56" rx="8" class="box"/>
  <text x="148" y="424" class="t" text-anchor="middle">Search engine</text>
  <text x="148" y="442" class="s" text-anchor="middle">BM25 copy of the data</text>

  <!-- right column -->
  <rect x="332" y="200" width="200" height="56" rx="8" class="box"/>
  <text x="432" y="224" class="t" text-anchor="middle">Embedding API</text>
  <text x="432" y="242" class="s" text-anchor="middle">every query, every chunk</text>

  <rect x="332" y="300" width="200" height="56" rx="8" class="box"/>
  <text x="432" y="324" class="t" text-anchor="middle">Vector database</text>
  <text x="432" y="342" class="s" text-anchor="middle">vector copy of the data</text>

  <rect x="332" y="400" width="200" height="56" rx="8" class="box"/>
  <text x="432" y="424" class="t" text-anchor="middle">Rerank API</text>
  <text x="432" y="442" class="s" text-anchor="middle">own key, quota, fallback</text>

  <!-- sync arrows -->
  <line x1="148" y1="256" x2="148" y2="297" stroke="#FF6960" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <line x1="148" y1="356" x2="148" y2="397" stroke="#FF6960" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <line x1="248" y1="328" x2="329" y2="328" stroke="#FF6960" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <line x1="432" y1="256" x2="432" y2="297" stroke="#9ea2a1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="190" y="496" width="200" height="56" rx="8" class="box"/>
  <text x="290" y="520" class="t" text-anchor="middle">LLM</text>
  <text x="290" y="538" class="s" text-anchor="middle">generation</text>

  <text x="290" y="574" class="m" text-anchor="middle">per question: four calls from the app (embed, vector,</text>
  <text x="290" y="590" class="m" text-anchor="middle">lexical, rerank), fusion in app code, then the LLM</text>

  <!-- ============ RIGHT: MongoDB ============ -->
  <rect x="624" y="24" width="552" height="572" rx="14" fill="#001e2b" stroke="rgba(0,237,100,0.45)"/>
  <text x="648" y="62" class="h">THIS POV ON MONGODB 9</text>
  <text x="648" y="84" class="m">one cluster, one aggregation per question, nothing to copy out</text>

  <rect x="660" y="104" width="200" height="56" rx="8" class="box"/>
  <text x="760" y="128" class="t" text-anchor="middle">Application</text>
  <text x="760" y="146" class="s" text-anchor="middle">builds one pipeline</text>

  <rect x="952" y="104" width="200" height="56" rx="8" class="box"/>
  <text x="1052" y="128" class="t" text-anchor="middle">Claude via gateway</text>
  <text x="1052" y="146" class="s" text-anchor="middle">only generation leaves</text>

  <line x1="860" y1="132" x2="949" y2="132" stroke="#9ea2a1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="906" y="124" class="m" text-anchor="middle" font-size="10.5">8 chunks</text>

  <line x1="760" y1="160" x2="760" y2="211" stroke="#00ED64" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="770" y="190" class="m mono" fill="#00ED64" font-size="11">1 aggregation</text>

  <!-- cluster -->
  <rect x="648" y="214" width="504" height="358" rx="12" fill="rgba(0,237,100,0.05)" stroke="#00ED64" stroke-width="1.5"/>
  <text x="666" y="238" fill="#00ED64" font-size="11" font-weight="700" letter-spacing="1.4">MONGODB ATLAS CLUSTER</text>

  <!-- pipeline -->
  <rect x="664" y="252" width="308" height="304" rx="10" fill="#061621" stroke="#2a424d"/>
  <text x="680" y="276" class="s mono" fill="#fdfff5">documents.aggregate()</text>
  <text x="680" y="294" class="m" font-size="11">ACL + tenant filter inside each branch</text>

  <rect x="676" y="306" width="140" height="66" rx="8" class="stage"/>
  <text x="746" y="328" class="t mono" text-anchor="middle" font-size="13">$vectorSearch</text>
  <text x="746" y="346" class="s" text-anchor="middle" font-size="11">autoEmbed · voyage-4</text>
  <rect x="712" y="354" width="68" height="14" rx="7" class="pill"/>
  <text x="746" y="364.5" class="pill-t" text-anchor="middle">PREVIEW</text>

  <rect x="824" y="306" width="136" height="66" rx="8" class="stage"/>
  <text x="892" y="328" class="t mono" text-anchor="middle" font-size="13">$search</text>
  <text x="892" y="346" class="s" text-anchor="middle" font-size="11">BM25 · text_index</text>
  <text x="892" y="362" class="m" text-anchor="middle" font-size="10.5">exact terms, acronyms</text>

  <line x1="746" y1="372" x2="790" y2="389" stroke="#00ED64" stroke-width="1.4" marker-end="url(#arrow-green)"/>
  <line x1="892" y1="372" x2="848" y2="389" stroke="#00ED64" stroke-width="1.4" marker-end="url(#arrow-green)"/>

  <rect x="676" y="392" width="284" height="42" rx="8" class="stage"/>
  <text x="818" y="412" class="t mono" text-anchor="middle" font-size="13">$rankFusion</text>
  <text x="818" y="427" class="s" text-anchor="middle" font-size="11">reciprocal rank fusion, in the database</text>

  <line x1="818" y1="434" x2="818" y2="447" stroke="#00ED64" stroke-width="1.4" marker-end="url(#arrow-green)"/>

  <rect x="676" y="450" width="284" height="42" rx="8" class="stage"/>
  <text x="790" y="470" class="t mono" text-anchor="middle" font-size="13">$rerank · rerank-3</text>
  <text x="790" y="485" class="s" text-anchor="middle" font-size="11">cross-encoder, in the database</text>
  <rect x="880" y="464" width="68" height="14" rx="7" class="pill"/>
  <text x="914" y="474.5" class="pill-t" text-anchor="middle">PREVIEW</text>

  <line x1="818" y1="492" x2="818" y2="505" stroke="#00ED64" stroke-width="1.4" marker-end="url(#arrow-green)"/>

  <rect x="676" y="508" width="284" height="36" rx="8" class="stage"/>
  <text x="818" y="531" class="t mono" text-anchor="middle" font-size="13">$limit 8</text>

  <!-- same database -->
  <text x="986" y="276" class="m" font-size="11" letter-spacing="0.6">SAME CLUSTER</text>
  <rect x="984" y="286" width="156" height="58" rx="8" class="box"/>
  <text x="996" y="308" class="t" font-size="13">chunks</text>
  <text x="996" y="326" class="s" font-size="11">+ ACL, tenant, TTL</text>

  <rect x="984" y="352" width="156" height="58" rx="8" class="box"/>
  <text x="996" y="374" class="t" font-size="13">conversations</text>
  <text x="996" y="392" class="s" font-size="11">resumed by thread</text>

  <rect x="984" y="418" width="156" height="58" rx="8" class="box"/>
  <text x="996" y="440" class="t" font-size="13">agent checkpoints</text>
  <text x="996" y="458" class="s" font-size="11">LangGraph state</text>

  <rect x="984" y="484" width="156" height="58" rx="8" class="box"/>
  <text x="996" y="506" class="t" font-size="13">vectors</text>
  <text x="996" y="524" class="s" font-size="11">kept in sync by Atlas</text>

  <!-- ============ footer ============ -->
  <rect x="24" y="612" width="1152" height="94" rx="14" fill="#0a2633" stroke="#2a424d"/>
  <text x="48" y="638" class="m" font-size="11" letter-spacing="0.8">MEASURED IN THIS POV · CLASSIC PATH (VOYAGE SDK + RRF IN PYTHON) → NATIVE PATH · SAME 303 CHUNKS</text>

  <text x="48" y="672" class="t mono" font-size="20" fill="#00ED64">4 → 1</text>
  <text x="128" y="672" class="s">round trips per question</text>

  <text x="390" y="672" class="t mono" font-size="20" fill="#00ED64">852 → 743 ms</text>
  <text x="560" y="672" class="s">retrieval latency</text>

  <text x="760" y="672" class="t mono" font-size="20" fill="#00ED64">0</text>
  <text x="784" y="672" class="s">external AI keys for retrieval</text>

  <text x="48" y="694" class="m" font-size="10.5">autoEmbed and rerank-3 are previews on MongoDB 9. Embedding and rerank are billed by the platform. Generation still goes through the gateway.</text>
</svg>
